[project]
name = "aftershock"
version = "0.1.0"
description = "Stage 1 harness: measuring a healthy vLLM server under open-loop load"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "prometheus-client>=0.20",
    "nvidia-ml-py>=12; sys_platform == 'linux'",
]

[project.optional-dependencies]
# Installed only on the GPU VM. Pinned for the whole study (CLAUDE.md rule 3).
server = ["vllm==0.32.0; sys_platform == 'linux'"]
analysis = ["matplotlib>=3.8", "jupyter>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
# uv-managed CPython ships its headers (Python.h), which Triton needs to compile its CUDA helper at
# vLLM startup; it is also the same build on the Mac and the VM. See docs/decisions.md.
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
