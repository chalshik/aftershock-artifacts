[project]
name = "aftershock"
version = "0.1.0"
description = "Stage 1 harness: measuring a healthy vLLM server under open-loop load"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "prometheus-client>=0.20",
    "nvidia-ml-py>=12; sys_platform == 'linux'",
]

[project.optional-dependencies]
# Installed only on the GPU VM. Pinned for the whole study (CLAUDE.md rule 3).
server = [
    "vllm==0.32.0; sys_platform == 'linux'",
    # Prebuilt FlashInfer kernels, the same packages `vllm download-kernels` installs; without them
    # vLLM's sampler JIT-compiles FlashInfer at startup, which needs nvcc (no CUDA toolkit on the VM).
    "flashinfer-cubin==0.7.0.post1; sys_platform == 'linux'",
    "flashinfer-jit-cache==0.7.0.post1+cu130; sys_platform == 'linux'",
    # Its per-architecture packages, listed directly so [tool.uv.sources] applies (RTX 3090 uses sm80).
    "flashinfer-jit-cache-sm80==0.7.0.post1+cu130; sys_platform == 'linux'",
    "flashinfer-jit-cache-sm89==0.7.0.post1+cu130; sys_platform == 'linux'",
    "flashinfer-jit-cache-sm90a==0.7.0.post1+cu130; sys_platform == 'linux'",
    "flashinfer-jit-cache-sm100a==0.7.0.post1+cu130; sys_platform == 'linux'",
    "flashinfer-jit-cache-sm103a==0.7.0.post1+cu130; sys_platform == 'linux'",
    "flashinfer-jit-cache-sm120f==0.7.0.post1+cu130; sys_platform == 'linux'",
]
analysis = ["matplotlib>=3.8", "jupyter>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
# uv-managed CPython ships its headers (Python.h), which Triton needs to compile its CUDA helper at
# vLLM startup; it is also the same build on the Mac and the VM. See docs/decisions.md.
python-preference = "only-managed"
# flashinfer-jit-cache's metadata lists ARM-only packages (Jetson Thor / GB10); uv assumes one metadata
# set for all wheels, so restrict those to aarch64. Our VM is x86_64, so they are never installed.
override-dependencies = [
    "flashinfer-jit-cache-sm110a; platform_machine == 'aarch64'",
    "flashinfer-jit-cache-sm121a; platform_machine == 'aarch64'",
]
# Only the two machines this study uses: the GPU VM and the analysis Mac.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl"
explicit = true

[[tool.uv.index]]
name = "flashinfer-cu130"
url = "https://flashinfer.ai/whl/cu130"
explicit = true

[tool.uv.sources]
flashinfer-cubin = { index = "flashinfer" }
flashinfer-jit-cache = { index = "flashinfer-cu130" }
flashinfer-jit-cache-sm80 = { index = "flashinfer-cu130" }
flashinfer-jit-cache-sm89 = { index = "flashinfer-cu130" }
flashinfer-jit-cache-sm90a = { index = "flashinfer-cu130" }
flashinfer-jit-cache-sm100a = { index = "flashinfer-cu130" }
flashinfer-jit-cache-sm103a = { index = "flashinfer-cu130" }
flashinfer-jit-cache-sm120f = { index = "flashinfer-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]
