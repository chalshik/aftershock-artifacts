# Up-then-down ramp, 600 s per step, default KV pool: 2 -> 5 -> 2 req/s in 0.5 steps. See docs/decisions.md.
extends: stage2_cap_base.yaml
name: ramp_d600
seed: 1
workload:
  rate: 2
  duration_s: 7800
  steps:
    - {at_s: 600, rate: 2.5}
    - {at_s: 1200, rate: 3}
    - {at_s: 1800, rate: 3.5}
    - {at_s: 2400, rate: 4}
    - {at_s: 3000, rate: 4.5}
    - {at_s: 3600, rate: 5}
    - {at_s: 4200, rate: 4.5}
    - {at_s: 4800, rate: 4}
    - {at_s: 5400, rate: 3.5}
    - {at_s: 6000, rate: 3}
    - {at_s: 6600, rate: 2.5}
    - {at_s: 7200, rate: 2}
ramp:
  settle_frac: 0.5     # each step is judged over its second half
