# Up-then-down ramp, 300 s per step, default KV pool: 2 -> 5 -> 2 req/s in 0.5 steps. See docs/decisions.md.
extends: stage2_cap_base.yaml
name: ramp_d300
seed: 1
workload:
  rate: 2
  duration_s: 3900
  steps:
    - {at_s: 300, rate: 2.5}
    - {at_s: 600, rate: 3}
    - {at_s: 900, rate: 3.5}
    - {at_s: 1200, rate: 4}
    - {at_s: 1500, rate: 4.5}
    - {at_s: 1800, rate: 5}
    - {at_s: 2100, rate: 4.5}
    - {at_s: 2400, rate: 4}
    - {at_s: 2700, rate: 3.5}
    - {at_s: 3000, rate: 3}
    - {at_s: 3300, rate: 2.5}
    - {at_s: 3600, rate: 2}
ramp:
  settle_frac: 0.5     # each step is judged over its second half
